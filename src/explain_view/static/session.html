<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>explain-view</title>
<script>
  (function () {
    var KEY = "omarchy-theme";
    var t = null;
    try { t = localStorage.getItem(KEY); } catch (e) {}
    if (!t) {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "tokyo-night" : "catppuccin-latte";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="stylesheet" href="/static/themes.css">
<link rel="stylesheet" href="/static/terminal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">explain-view</a>
  <span id="title" class="title"></span>
  <span id="phase" class="phase" hidden></span>
  <span id="live" class="live off" title="Live updates from the session">offline</span>
  <button id="export" class="btn">Export to vault</button>
</header>

<main class="layout">
  <section class="workspace">
    <nav class="tabs">
      <button class="tab" data-tab="plan" title="Plan (1)">plan</button>
      <button class="tab" data-tab="doc" title="Explanation (2)">explanation</button>
    </nav>
    <div id="plan-view" class="view plan" data-view="plan">
      <div class="plan-inner">
        <button id="approve" class="btn primary approve" hidden>Approve plan</button>
        <div id="revision" class="revision" hidden></div>
        <div class="pane-head">outline</div>
        <ol id="outline" class="outline"></ol>
        <div id="decisions-head" class="pane-head" hidden>decisions</div>
        <ol id="decisions" class="decisions"></ol>
        <div class="pane-head">lexicon</div>
        <table id="lexicon" class="lexicon"></table>
      </div>
    </div>
    <article id="doc" class="view doc" data-view="doc"></article>
  </section>

  <aside class="col review">
    <div class="pane-head">review <span id="draft-count" class="dim"></span></div>
    <p class="hint dim">Select text in the explanation, or use « + comment » on an item of the plan. Comments stay here until you send them together.</p>
    <div id="drafts"></div>
    <textarea id="note" class="note" rows="3" placeholder="General note for the whole batch (optional)"></textarea>
    <button id="send" class="btn primary" disabled>Send</button>
    <div class="pane-head">sent</div>
    <div id="sent"></div>
  </aside>
</main>

<button id="comment-btn" class="btn primary floating" hidden>+ comment</button>
<div id="composer" class="composer" hidden>
  <div class="composer-quote"></div>
  <textarea rows="4" placeholder="Your comment  (⌘↵ to add, Esc to cancel)"></textarea>
  <div class="composer-actions">
    <button class="btn cancel">Cancel</button>
    <button class="btn primary add">Add</button>
  </div>
</div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script defer src="/static/app.js"></script>
</body>
</html>
