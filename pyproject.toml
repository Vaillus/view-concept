[project]
name = "view-concept"
version = "0.1.0"
description = "Local workspace for the view-concept skill: plan and explanation side by side, comments sent back to the Claude Code session."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
view-concept = "view_concept.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/view_concept"]

[dependency-groups]
dev = ["ruff>=0.6", "ty", "pytest>=8", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
